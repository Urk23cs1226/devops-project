---
- name: Deploy HealthGuard AI to Kubernetes
  hosts: webservers
  gather_facts: false

  vars:
    k8s_manifests_dir: "/home/ubuntu/k8s"
    app_name: "healthguard-ai"
    namespace: "default"

  tasks:
    - name: Ensure K8s manifests directory exists on remote
      file:
        path: "{{ k8s_manifests_dir }}"
        state: directory

    - name: Copy K8s manifests to remote server
      copy:
        src: "{{ playbook_dir }}/../k8s/"
        dest: "{{ k8s_manifests_dir }}/"

    - name: Verify kubectl is available
      command: k3s kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Display kubectl version
      debug:
        msg: "{{ kubectl_version.stdout }}"

    - name: Apply Kubernetes Deployment
      command: >
        k3s kubectl apply -f {{ k8s_manifests_dir }}/deployment.yaml
        --namespace={{ namespace }}
      register: deploy_result

    - name: Display deployment result
      debug:
        msg: "{{ deploy_result.stdout }}"

    - name: Apply Kubernetes Service
      command: >
        k3s kubectl apply -f {{ k8s_manifests_dir }}/service.yaml
        --namespace={{ namespace }}
      register: service_result

    - name: Display service result
      debug:
        msg: "{{ service_result.stdout }}"

    - name: Trigger rolling restart of deployment
      command: >
        k3s kubectl rollout restart deployment/{{ app_name }}
        --namespace={{ namespace }}
      register: restart_result

    - name: Display restart result
      debug:
        msg: "{{ restart_result.stdout }}"

    - name: Wait for rollout to complete
      command: >
        k3s kubectl rollout status deployment/{{ app_name }}
        --namespace={{ namespace }}
        --timeout=120s
      register: rollout_status

    - name: Display rollout status
      debug:
        msg: "{{ rollout_status.stdout }}"

    - name: Get pod status
      command: k3s kubectl get pods -l app={{ app_name }} --namespace={{ namespace }}
      register: pods_info
      changed_when: false

    - name: Display running pods
      debug:
        msg: "{{ pods_info.stdout_lines }}"

    - name: Get deployment status
      command: k3s kubectl get deployments --namespace={{ namespace }}
      register: deploy_info
      changed_when: false

    - name: Display deployments
      debug:
        msg: "{{ deploy_info.stdout_lines }}"

    - name: Get service status
      command: k3s kubectl get services --namespace={{ namespace }}
      register: svc_info
      changed_when: false

    - name: Display services
      debug:
        msg: "{{ svc_info.stdout_lines }}"

    - name: Deployment summary
      debug:
        msg: |
          =============================================
           HealthGuard AI Deployment Complete!
          =============================================
           App:       {{ app_name }}
           Namespace: {{ namespace }}
           Service:   NodePort 30080
          =============================================
