<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HealthGuard AI — Intelligent disease prediction powered by machine learning. Describe your symptoms and get instant AI-powered health insights.">
    <title>HealthGuard AI — Symptom Checker</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🛡️</text></svg>">
</head>
<body>
    <div class="app-container">

        <!-- Navigation -->
        <nav class="navbar" id="main-nav">
            <div class="navbar-brand">
                <div class="navbar-logo">🛡️</div>
                <div>
                    <div class="navbar-title">HealthGuard AI</div>
                    <div class="navbar-subtitle">Symptom Intelligence</div>
                </div>
            </div>
            <div class="navbar-links">
                <select id="language-selector" class="lang-selector">
                    <option value="en">🇺🇸 English</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="hi">🇮🇳 Hindi</option>
                    <option value="ta">🇮🇳 Tamil</option>
                </select>
                <a href="/" class="nav-link active" id="nav-chat">💬 Chat</a>
                <a href="/dashboard" class="nav-link" id="nav-dashboard">📊 Dashboard</a>
            </div>
        </nav>

        <!-- Chat Area -->
        <div class="chat-wrapper">

            <!-- Welcome Screen (hidden when chat starts) -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-icon">🩺</div>
                <h1 class="welcome-title">What symptoms are you experiencing?</h1>
                <p class="welcome-subtitle">
                    Describe your symptoms and our AI will analyze them to suggest possible conditions.
                    Select from the suggestions or type your own.
                </p>
                <div class="quick-actions" id="quick-actions">
                    <button class="quick-action" data-symptoms="headache,fever,fatigue">🤒 Headache & Fever</button>
                    <button class="quick-action" data-symptoms="cough,sore_throat,runny_nose">🤧 Cold Symptoms</button>
                    <button class="quick-action" data-symptoms="chest_pain,shortness_of_breath">💔 Chest Pain</button>
                    <button class="quick-action" data-symptoms="nausea,vomiting,diarrhea">🤢 Stomach Issues</button>
                    <button class="quick-action" data-symptoms="joint_pain,stiffness,fatigue">🦴 Joint Pain</button>
                    <button class="quick-action" data-symptoms="itchy_skin,red_patches,dry_skin">🔴 Skin Problems</button>
                </div>
            </div>

            <!-- Messages Container -->
            <div class="chat-messages" id="chat-messages" style="display: none;"></div>

            <!-- Input Area -->
            <div class="chat-input-area" id="chat-input-area">
                <div class="input-container" style="position: relative;">
                    <!-- Autocomplete dropdown -->
                    <div class="autocomplete-dropdown" id="autocomplete-dropdown"></div>

                    <div class="input-wrapper">
                        <div class="selected-symptoms" id="selected-symptoms"></div>
                        <input
                            type="text"
                            id="symptom-input"
                            placeholder="Type a symptom (e.g. headache, fever, cough)..."
                            autocomplete="off"
                        >
                    </div>
                    <button class="send-btn" id="send-btn" title="Send symptoms for analysis">
                        ➤
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script src="/js/chat.js"></script>
</body>
</html>
