name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: symptom-app

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3


    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'


    - name: Install Dependencies
      run: pip install -r requirements.txt


    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Docker Image
      run: |
        DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]')
        docker build -t "${DOCKER_USER}/${{ env.DOCKER_IMAGE }}" .


    - name: Push Docker Image
      run: |
        DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]')
        docker push "${DOCKER_USER}/${{ env.DOCKER_IMAGE }}"


    - name: Install Ansible
      run: pip install ansible


    - name: Start Minikube
      uses: medyagh/setup-minikube@latest


    - name: Verify Kubernetes Cluster
      run: |
        kubectl cluster-info
        kubectl get nodes


    - name: Update Kubernetes Deployment Image
      run: |
        DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]')
        sed -i "s|YOUR_DOCKERHUB_USERNAME/healthguard-ai:latest|${DOCKER_USER}/${{ env.DOCKER_IMAGE }}:latest|g" k8s/deployment.yaml
        echo "Updated image in deployment.yaml:"
        grep "image:" k8s/deployment.yaml


    - name: Deploy using Ansible
      run: ansible-playbook ansible/deploy.yml -i ansible/inventory.ini


    - name: Verify Kubernetes Deployment
      run: |
        echo "========== PODS =========="
        kubectl get pods
        echo ""
        echo "========== DEPLOYMENTS =========="
        kubectl get deployments
        echo ""
        echo "========== SERVICES =========="
        kubectl get services