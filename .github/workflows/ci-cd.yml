name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: symptom-app

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3


    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'


    - name: Install Dependencies
      run: pip install -r requirements.txt


    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Docker Image
      run: |
        DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]')
        docker build -t "${DOCKER_USER}/${{ env.DOCKER_IMAGE }}" .


    - name: Push Docker Image
      run: |
        DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]')
        docker push "${DOCKER_USER}/${{ env.DOCKER_IMAGE }}"


    - name: Install Ansible
      run: pip install ansible


    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_wrapper: false

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: ./terraform

    - name: Get EC2 IP Address
      id: get_ip
      run: |
        EC2_IP=$(terraform output -raw instance_public_ip)
        echo "EC2_IP_ADDRESS=$EC2_IP" >> $GITHUB_ENV
      working-directory: ./terraform

    - name: Configure SSH Key
      run: |
        mkdir -p ~/.ssh/
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Setup Ansible Inventory
      run: |
        echo "[webservers]" > ansible/inventory.ini
        echo "app_server ansible_host=${{ env.EC2_IP_ADDRESS }} ansible_user=ubuntu ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini
        cat ansible/inventory.ini


    - name: Update Kubernetes Deployment Image
      run: |
        DOCKER_USER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]')
        sed -i "s|YOUR_DOCKERHUB_USERNAME/healthguard-ai:latest|${DOCKER_USER}/${{ env.DOCKER_IMAGE }}:latest|g" k8s/deployment.yaml
        echo "Updated image in deployment.yaml:"
        grep "image:" k8s/deployment.yaml


    - name: Provision EC2 with K3s
      run: ansible-playbook ansible/provision.yml -i ansible/inventory.ini
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"

    - name: Deploy using Ansible
      run: ansible-playbook ansible/deploy.yml -i ansible/inventory.ini
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"