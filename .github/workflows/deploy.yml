
name: HealthGuard AI — K8s Deployment Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # Allow manual trigger

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/healthguard-ai
  K8S_NAMESPACE: default

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 1: Test — Install dependencies, train model, verify
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  test:
    name: 🧪 Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🧠 Train ML model
        run: python -m app.ml.train_model

      - name: ✅ Verify model artifacts
        run: |
          test -f app/ml/model.joblib      && echo "✅ model.joblib exists"
          test -f app/ml/label_encoder.joblib && echo "✅ label_encoder.joblib exists"
          test -f app/ml/symptom_list.json  && echo "✅ symptom_list.json exists"
          echo "✅ All model artifacts verified!"

      - name: 🔍 Python syntax check
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/config.py
          echo "✅ Syntax check passed!"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 2: Build — Docker image build & push to DockerHub
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Image push confirmation
        run: |
          echo "═══════════════════════════════════════════"
          echo " Docker image pushed successfully!"
          echo " Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo " Tag:   ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo "═══════════════════════════════════════════"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 3: Deploy — Execute Ansible playbook for K8s
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy:
    name: 🚀 Deploy via Ansible to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Ansible
        run: pip install ansible

      - name: ☸️ Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: 🔑 Configure Kubernetes credentials
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: 🔄 Update deployment image tag
        run: |
          sed -i "s|YOUR_DOCKERHUB_USERNAME/healthguard-ai:latest|${{ env.DOCKER_IMAGE }}:${{ github.sha }}|g" k8s/deployment.yaml
          echo "Updated image to: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          cat k8s/deployment.yaml | grep "image:"

      - name: 🎯 Run Ansible deployment playbook
        run: |
          cd ansible
          ansible-playbook deploy.yml \
            -e "docker_image=${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            -e "namespace=${{ env.K8S_NAMESPACE }}" \
            -v
        env:
          ANSIBLE_FORCE_COLOR: "true"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 4: Verify — Post-deployment checks
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  verify:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: ☸️ Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: 🔑 Configure Kubernetes credentials
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: 📋 Get pod status
        run: |
          echo "═══════════════════════════════════════════"
          echo " Pod Status"
          echo "═══════════════════════════════════════════"
          kubectl get pods -l app=healthguard-ai -o wide

      - name: 📋 Get deployment status
        run: |
          echo "═══════════════════════════════════════════"
          echo " Deployment Status"
          echo "═══════════════════════════════════════════"
          kubectl get deployments -o wide

      - name: 📋 Get service status
        run: |
          echo "═══════════════════════════════════════════"
          echo " Service Status"
          echo "═══════════════════════════════════════════"
          kubectl get services -o wide

      - name: 🏥 Health check smoke test
        run: |
          echo "═══════════════════════════════════════════"
          echo " Health Check"
          echo "═══════════════════════════════════════════"
          # Get the ClusterIP service endpoint
          SVC_IP=$(kubectl get svc healthguard-ai-service -o jsonpath='{.spec.clusterIP}')
          echo "Service ClusterIP: $SVC_IP"

          # Port-forward and test health endpoint
          kubectl port-forward svc/healthguard-ai-service 8080:80 &
          PF_PID=$!
          sleep 5

          # Test health endpoint
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health || true)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed! (HTTP $HTTP_STATUS)"
            curl -s http://localhost:8080/api/health | python3 -m json.tool
          else
            echo "⚠️  Health check returned HTTP $HTTP_STATUS"
          fi

          # Cleanup port-forward
          kill $PF_PID 2>/dev/null || true

      - name: 📊 Deployment summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo " ✅ HealthGuard AI Deployment Verified!"
          echo "═══════════════════════════════════════════════════"
          echo " Image:     ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo " Namespace: ${{ env.K8S_NAMESPACE }}"
          echo " Service:   healthguard-ai-service (NodePort 30080)"
          echo "═══════════════════════════════════════════════════"
