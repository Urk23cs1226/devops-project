# ──────────────────────────────────────────────────────────
# HealthGuard AI — Kubernetes Service
# ──────────────────────────────────────────────────────────
# Exposes the HealthGuard AI deployment externally via NodePort.
#   • Port 80 → Container port 8000
#   • NodePort 30080 for direct cluster access
#   • Suitable for Minikube and bare-metal clusters
#   • For cloud deployments, change type to LoadBalancer
# ──────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: healthguard-ai-service
  labels:
    app: healthguard-ai
    environment: production
spec:
  type: NodePort
  selector:
    app: healthguard-ai
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080
